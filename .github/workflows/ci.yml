name: CI and deployment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: labforge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d labforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-password@localhost:5432/labforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r api/requirements.txt
      - run: ruff check --select E4,E7,E9,F,I api worker
      - run: python -m pytest -q api/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm ci && npm test
        working-directory: guac-proxy
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep

  publish-staging-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Validate registry configuration
        shell: bash
        run: |
          if [[ ! "$AZURE_ACR_NAME" =~ ^[a-z0-9]{5,50}$ ]]; then
            echo "Set staging environment variable AZURE_ACR_NAME to the deployed registry name." >&2
            exit 1
          fi
      - name: Sign in to Azure Container Registry
        run: az acr login --name "$AZURE_ACR_NAME"
      - name: Build and publish staging images
        env:
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REGISTRY_LOGIN_SERVER="$AZURE_ACR_NAME.azurecr.io"
          docker build -t "$REGISTRY_LOGIN_SERVER/labforge-api:$IMAGE_TAG" -f api/Dockerfile .
          docker build -t "$REGISTRY_LOGIN_SERVER/labforge-web:$IMAGE_TAG" -f web/Dockerfile ./web
          docker build -t "$REGISTRY_LOGIN_SERVER/labforge-guac:$IMAGE_TAG" -f guac-proxy/Dockerfile ./guac-proxy
          docker push "$REGISTRY_LOGIN_SERVER/labforge-api:$IMAGE_TAG"
          docker push "$REGISTRY_LOGIN_SERVER/labforge-web:$IMAGE_TAG"
          docker push "$REGISTRY_LOGIN_SERVER/labforge-guac:$IMAGE_TAG"

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-staging-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Production deployment requires an approved release after staging verification."
